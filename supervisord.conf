[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:manager-ui]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /ros2_ws/install/setup.bash && uvicorn manager_ui.backend.main:app --host 0.0.0.0 --port 8000"
directory=/app
environment=PYTHONPATH="/app"
autostart=true
autorestart=true
startretries=10
startsecs=5
stdout_logfile=/var/log/manager-ui.log
stderr_logfile=/var/log/manager-ui.log

[program:db-logger]
command=/bin/bash -c "source /opt/ros/humble/setup.bash && source /ros2_ws/install/setup.bash && ros2 run db_logger db_logger_node"
autostart=true
autorestart=true
startretries=10
startsecs=5
stdout_logfile=/var/log/db-logger.log
stderr_logfile=/var/log/db-logger.log
