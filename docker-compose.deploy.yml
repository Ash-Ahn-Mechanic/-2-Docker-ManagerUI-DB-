services:
  mysql:
    image: mysql:8.0
    network_mode: host
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: robot_admin
      MYSQL_USER: robot
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - ./db_data/mysql:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./db_data/mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  robot:
    image: ash20000529/robot-stack:ver12
    restart: unless-stopped
    network_mode: host
    env_file: .env
    environment:
      TZ: Asia/Seoul
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
